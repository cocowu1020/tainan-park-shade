<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive map of park shade and heat risk in Tainan.">
  <title>Tainan Park Shade Explorer</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Tainan Park Shade Explorer</h1>
      <p>Park heat risk and shade, 21 July 2026</p>
    </div>
    <button id="panel-toggle" class="panel-toggle" type="button" aria-controls="sidebar" aria-expanded="true">
      Layers
    </button>
  </header>

  <main class="app-shell">
    <aside id="sidebar" class="sidebar">
      <section class="control-section">
        <label for="park-search">Find a park</label>
        <select id="park-search">
          <option value="">All parks</option>
        </select>
      </section>

      <section class="control-section">
        <span class="section-label">Heat-risk period</span>
        <div class="segmented" role="group" aria-label="Heat-risk period">
          <button type="button" class="metric-button active" data-metric="morning">Morning</button>
          <button type="button" class="metric-button" data-metric="afternoon">Afternoon</button>
        </div>
      </section>

      <section class="control-section layer-options">
        <span class="section-label">Village layers</span>
        <label class="toggle-row">
          <input id="show-income" type="checkbox">
          <span>Median income</span>
        </label>
        <label class="toggle-row">
          <input id="show-population" type="checkbox">
          <span>Population age 0–12</span>
        </label>
      </section>

      <section class="control-section layer-options">
        <span class="section-label">Map layers</span>
        <label class="toggle-row">
          <input id="show-trees" type="checkbox">
          <span>Tree canopy ≥2 m</span>
        </label>
        <label class="toggle-row">
          <input id="show-tree-shadows" type="checkbox">
          <span>Projected tree shadows</span>
        </label>
        <label class="toggle-row">
          <input id="show-buildings" type="checkbox">
          <span>Buildings</span>
        </label>
        <label class="toggle-row">
          <input id="show-shadows" type="checkbox" checked>
          <span>Building shadows</span>
        </label>
      </section>

      <section class="control-section shadow-time">
        <label for="shadow-hour">Shadow time</label>
        <select id="shadow-hour">
          <option value="0900">09:00</option>
          <option value="1000">10:00</option>
          <option value="1100">11:00</option>
          <option value="1200">12:00</option>
          <option value="1300">13:00</option>
          <option value="1400">14:00</option>
          <option value="1500" selected>15:00</option>
          <option value="1600">16:00</option>
          <option value="1700">17:00</option>
          <option value="1800">18:00</option>
        </select>
      </section>

      <section class="ranking-section">
        <div class="ranking-heading">
          <h2>Highest heat risk</h2>
          <span id="ranking-period">09:00–10:00</span>
        </div>
        <ol id="ranking-list" class="ranking-list"></ol>
      </section>

      <a class="download-link" href="downloads/park_shadow_coverage.xlsx?v=20261006-4" download>Download park results</a>
    </aside>

    <section class="map-region" aria-label="Interactive map">
      <div id="map"></div>
      <div id="loading-status" class="loading-status" role="status" aria-live="polite">Loading map data…</div>
      <div id="legend" class="map-legend"></div>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="app.js?v=20261006-4"></script>
</body>
</html>
